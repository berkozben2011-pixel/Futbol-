<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Animated Character Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; color: white; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; }
    #controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
    button { padding: 10px 20px; font-size: 14px; background: #ff9800; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: bold; }
    button.active { background: #4caf50; }
    button:hover { opacity: 0.9; }
    #anim-name { font-size: 18px; font-weight: bold; color: #ffeb3b; }
  </style>
</head>
<body>
  <div id="info">
    <div>Procedural Character Animation Test</div>
    <div id="anim-name">Current: idle</div>
    <div style="margin-top: 10px; font-size: 12px; opacity: 0.8;">
      Koşma, dribbling, şut animasyonları test ediliyor.
    </div>
  </div>
  <div id="controls">
    <button id="btn-idle" class="active">Idle</button>
    <button id="btn-run">Run</button>
    <button id="btn-dribble">Dribble</button>
    <button id="btn-shoot">Shoot</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { createAnimatedCharacterModel } from './client/src/characters/AnimatedCharacter.js';

    // Three.js sahne kurulumu
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Işıklar
    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);

    // Zemín
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Çizgiler
    const grid = new THREE.GridHelper(20, 40, 0x448844, 0x224422);
    scene.add(grid);

    // Karakter oluştur
    const { mesh: character, mixer } = createAnimatedCharacterModel(THREE, {
      height: 1.8,
      bodyColor: 0x2196f3,
      accentColor: 0xffffff
    });
    scene.add(character);

    // Animasyon state
    let currentAction = 'idle';
    let currentClipAction = null;
    const clips = {};
    character.animations.forEach(clip => {
      clips[clip.name] = mixer.clipAction(clip);
    });

    function playAnimation(name) {
      if (!clips[name]) return;
      if (currentClipAction) {
        currentClipAction.fadeOut(0.2);
      }
      currentClipAction = clips[name];
      currentClipAction.reset().fadeIn(0.2).play();
      currentAction = name;
      document.getElementById('anim-name').textContent = `Current: ${name}`;

      // Butonları güncelle
      document.querySelectorAll('#controls button').forEach(btn => {
        btn.classList.toggle('active', btn.id === 'btn-' + name);
      });
    }

    // Buton eventleri
    document.getElementById('btn-idle').onclick = () => playAnimation('idle');
    document.getElementById('btn-run').onclick = () => playAnimation('run');
    document.getElementById('btn-dribble').onclick = () => playAnimation('dribble');
    document.getElementById('btn-shoot').onclick = () => {
      playAnimation('shoot');
      // Şut sonrası follow through
      setTimeout(() => {
        if (currentAction === 'shoot') {
          playAnimation('shootFollowThrough');
          setTimeout(() => playAnimation('idle'), 500);
        }
      }, 1000);
    };

    // Animasyon döngüsü
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      // Karakteri hafif döndür ki boyutları görün
      character.rotation.y += delta * 0.2;

      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('Character animations:', Object.keys(clips));
  </script>
</body>
</html>
